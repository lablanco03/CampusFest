<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Acceso Administrativo - CampusFest 2026</title>
	<link rel="stylesheet" href="css/login_admin.css">
	<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
	<div class="login_contenedor">
		<!-- Lado izquierdo -->
		<div class="login_izquierdo">
			<div class="login_info">
                <a href="index.html">
                    <img src="img/logo.jpg" alt="CampusFest" class="login_logo">
                </a>
				<p class="login_subtitulo">Panel de Administración</p>
				<p class="login_descripcion">
					Gestiona actividades, inscripciones,<br>
					stands y genera reportes del festival.
				</p>
			</div>
			<!-- Círculos decorativos -->
			<div class="circulo_decorativo circulo_1"></div>
			<div class="circulo_decorativo circulo_2"></div>
		</div>

		<!-- Lado derecho -->
		<div class="login_derecho">
			<div class="login_card">
				<h2>Iniciar sesión</h2>
				<p class="login_card_subtitulo">Acceso restringido al personal autorizado.</p>

				<form id="formularioLogin" class="login_formulario">
					<div class="grupo_formulario">
						<label for="txtCorreo">Correo electrónico</label>
						<input type="email" id="txtCorreo" placeholder="admin@campusfest.edu.cr" required>
					</div>

					<div class="grupo_formulario">
						<label for="txtContrasena">Contraseña</label>
						<div class="input_password">
							<input type="password" id="txtContrasena" placeholder="Ingrese su contraseña" required>
                                <button type="button" id="btnTogglePassword" class="btn_mostrar_password">
                                    <i data-lucide="eye-off" id="iconoOjoCerrado"></i>
                                    <i data-lucide="eye" id="iconoOjoAbierto" style="display: none;"></i>
                                </button>
						</div>
					</div>

					<button type="submit" class="btn_ingresar">Ingresar al panel</button>
				</form>

				<a href="#" class="login_olvidaste">¿Olvidaste tu contraseña?</a>

				<div class="login_demo">
					<p><strong>Demo</strong></p>
					<p>Correo: admin@campusfest.edu.cr</p>
					<p>Contraseña: admin123</p>
				</div>
			</div>
		</div>
	</div>

	<script>lucide.createIcons();</script>
	<script src="js/login_admin.js"></script>
</body>
</html>
