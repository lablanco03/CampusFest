<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción</title>
</head>
<body>
    <!-- INSCRIPCIÓN -->
<section class="titulo_pagina">
    <div class="contenedor">
        <h1>Inscripción</h1>
        <p>Completa el formulario para participar en las actividades del CampusFest 2026</p>
    </div>
</section>

<section class="seccion_formulario">
    <div class="contenedor_formulario">

        <form id="formularioInscripcion" class="formulario_inscripcion">

            <div class="grupo_formulario">
                <label for="txtNombreCompleto">Nombre completo</label>
                <input type="text" id="txtNombreCompleto">
            </div>

            <div class="grupo_formulario">
                <label for="txtIdentificacion">Identificación</label>
                <input type="text" id="txtIdentificacion">
            </div>

            <div class="grupo_formulario">
                <label for="txtCorreoElectronico">Correo electrónico</label>
                <input type="email" id="txtCorreoElectronico">
            </div>

            <div class="grupo_formulario">
                <label for="txtTelefono">Teléfono</label>
                <input type="text" id="txtTelefono">
            </div>

            <div class="grupo_formulario">
                <label for="txtCarreraGrupo">Carrera o grupo</label>
                <input type="text" id="txtCarreraGrupo">
            </div>

            <div class="grupo_formulario">
                <label for="ddlActividad">Actividad</label>

                <select id="ddlActividad">
                    <option value="">Seleccione una actividad</option>
                    <option>Hackathon Universitario</option>
                    <option>Torneo de Fútbol Interfacultades</option>
                    <option>Exposición de Arte Contemporáneo</option>
                    <option>Festival Gastronómico</option>
                    <option>Concierto de Bandas Universitarias</option>
                    <option>Taller de Robótica e IA</option>
                </select>
            </div>

            <div class="grupo_formulario">
                <label for="txtaComentarios">Comentarios</label>
                <textarea id="txtaComentarios" rows="5"></textarea>
            </div>

            <div class="grupo_checkbox">
                <input type="checkbox" id="chkAceptaTerminos">
                <label for="chkAceptaTerminos">
                    Confirmo que la información proporcionada es correcta.
                </label>
            </div>

            <button type="submit" id="btnEnviar" class="btn_formulario">
                Inscribirme
            </button>

            <p id="mensajeFormulario" class="mensaje_formulario"></p>

        </form>

    </div>
</section>

<script src="js/validaciones.js"></script>
<script src="js/inscripciones.js"></script>
</body>
</html>
